[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
[project]
name = "vendor-evidence-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = ["fastapi>=0.156.7,<1", "uvicorn>=0.54,<1", "httpx[socks]>=0.28,<1", "numpy>=2.2,<3", "rank-bm25>=0.2.2,<0.3", "fastembed>=0.7,<1", "langgraph>=1,<2", "langgraph-checkpoint-sqlite>=3,<4"]
[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10", "ruff>=0.17,<1", "mypy>=1.20,<2", "pip-audit>=2.10,<3"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["semantic: downloads and executes a pretrained embedding model"]
