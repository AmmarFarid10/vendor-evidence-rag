name: Quality
on: [push, pull_request]
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EMBEDDER: hash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install uv==0.13.4
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run mypy app --ignore-missing-imports
      - run: uv run pytest -q -m 'not semantic'
      - run: uv run python scripts/demo.py --check
      - run: uv run pip-audit
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t portfolio-app .
      - run: docker run --rm --entrypoint python portfolio-app scripts/demo.py --check
